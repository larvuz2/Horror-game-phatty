<!doctype html>
<html><head><meta charset="utf-8"><style>body{margin:0;background:#222}canvas{display:block}</style></head>
<body><script type="module">
import * as THREE from 'three'
import { GLTFLoader } from 'three/examples/jsm/loaders/GLTFLoader.js'
import { MeshoptDecoder } from 'three/examples/jsm/libs/meshopt_decoder.module.js'
import { buildCreatureRig, applyRigPose, setHandTwist } from '/src/creature/Creature.tsx'
setHandTwist(+(new URLSearchParams(location.search).get('twist') || 1.57))
const params = new URLSearchParams(location.search)
const raise = +(params.get('raise') || 0), glow = +(params.get('glow') || 0)
const renderer = new THREE.WebGLRenderer({ antialias: true })
renderer.setSize(1200, 600)
renderer.toneMapping = THREE.ACESFilmicToneMapping
document.body.appendChild(renderer.domElement)
const gltf = await new GLTFLoader().setMeshoptDecoder(MeshoptDecoder).loadAsync('/models/creature/creature_main.glb')
const rig = buildCreatureRig(gltf.scene)
applyRigPose(rig, raise, 0)
rig.eyeMat.opacity = Math.min(1, glow * 3); rig.eyeMat.color.setRGB(1,0.09,0.09).multiplyScalar(1+glow*7); rig.glowMat.opacity = glow*0.9
const views = [[0, 1.4, 3.6], [3.6, 1.4, 0.01], [0.4, 1.7, 1.0], [-2.5, 1.5, -2.5]]
renderer.setScissorTest(true)
views.forEach((p, i) => {
  const s = new THREE.Scene(); s.background = new THREE.Color(0x3a3a3a)
  s.add(new THREE.HemisphereLight(0xffffff, 0x333333, 1.5))
  const d = new THREE.DirectionalLight(0xffffff, 2.5); d.position.set(1, 3, 3); s.add(d)
  const r = rig.root
  s.add(r)
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(10,10), new THREE.MeshStandardMaterial({color:0x555555})); floor.rotation.x=-Math.PI/2; s.add(floor)
  const cam = new THREE.PerspectiveCamera(i === 2 ? 30 : 45, 300 / 600, 0.01, 50)
  cam.position.set(...p); cam.lookAt(0, i === 2 ? 2.1 : 1.2, 0)
  renderer.setViewport(i * 300, 0, 300, 600); renderer.setScissor(i * 300, 0, 300, 600)
  renderer.render(s, cam)
})
const box = new THREE.Box3().setFromObject(rig.root, true)
window.__labels = ['bbox ' + box.min.toArray().map(v=>v.toFixed(2)) + ' / ' + box.max.toArray().map(v=>v.toFixed(2))]
window.__done = true
</script></body></html>
